<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sculptor · 你的风格写作助手</title>
  <style>
    :root {
      --bg: #f6f3ec; --ink: #2b2118; --muted: #7a6a55; --card: #fffdf7;
      --line: #e6ddcd; --accent: #a45f2f; --accent-ink: #fff;
      --bubble-bot: #f0ead9; --bubble-user: #2b2118;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
    header h1 { font-size: 17px; margin: 0; font-weight: 600; }
    header .sub { color: var(--muted); font-size: 12px; }
    .spacer { flex: 1; }
    input[type=password], input[type=text] { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; background: #fff; width: 100%; }
    button { border: 0; border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
    button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    button.ghost:hover { background: #f0ead9; }
    .keybar { display: flex; gap: 8px; align-items: center; max-width: 420px; }
    main { max-width: 820px; margin: 0 auto; padding: 20px 16px 140px; }
    .msg { display: flex; margin: 10px 0; }
    .msg.bot { justify-content: flex-start; } .msg.user { justify-content: flex-end; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.65; font-size: 14px; white-space: pre-wrap; }
    .msg.bot .bubble { background: var(--bubble-bot); border: 1px solid var(--line); }
    .msg.user .bubble { background: var(--bubble-user); color: #fff; }
    .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .opts button { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
    .opts button:hover { background: var(--accent); color: #fff; }
    .composer { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 12px 20px; }
    .composer .row { display: flex; gap: 10px; max-width: 820px; margin: 0 auto; }
    textarea { flex: 1; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 14px; font-family: inherit; min-height: 46px; max-height: 120px; }
    .hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Sculptor</h1>
      <div class="sub">从修改中学习你的文风 · BYOK</div>
    </div>
    <div class="spacer"></div>
    <div class="keybar">
      <input id="key" type="password" placeholder="粘贴你的 LLM API Key（DeepSeek 等）" />
      <button id="saveKey">保存</button>
      <button id="newSession" class="ghost">新会话</button>
    </div>
  </header>

  <main id="chat"></main>

  <div class="composer">
    <div class="row">
      <textarea id="input" placeholder="想写点什么？（回车发送，Shift+回车换行）"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="hint" id="status">请先在上方粘贴并保存你的 API Key（Key 只存本地浏览器，不经服务器明文留存）</div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const keyInput = $('#key'), chat = $('#chat'), input = $('#input'), status = $('#status');
    let sessionId = null;

    function apiKey() { return localStorage.getItem('sculptor_key') || ''; }
    function setKey(k) { localStorage.setItem('sculptor_key', k); }
    keyInput.value = apiKey();
    $('#saveKey').onclick = () => { setKey(keyInput.value.trim()); status.textContent = keyInput.value.trim() ? 'Key 已保存（仅本地）' : '请先保存 Key'; };

    function addBubble(role, text, opts) {
      const wrap = document.createElement('div'); wrap.className = 'msg ' + role;
      const b = document.createElement('div'); b.className = 'bubble'; b.textContent = text;
      wrap.appendChild(b);
      if (opts && opts.length) {
        const o = document.createElement('div'); o.className = 'opts';
        opts.forEach((label, i) => {
          const btn = document.createElement('button');
          btn.textContent = String.fromCharCode(65 + i) + '. ' + label;
          btn.onclick = () => send(label);
          o.appendChild(btn);
        });
        wrap.querySelector('.bubble').appendChild(o);
      }
      chat.appendChild(wrap); chat.scrollTop = chat.scrollHeight;
    }

    async function send(text) {
      const key = apiKey();
      if (!key) { status.textContent = '请先保存你的 API Key'; keyInput.focus(); return; }
      const msg = (typeof text === 'string' ? text : input.value).trim();
      if (!msg) return;
      input.value = '';
      addBubble('user', msg);
      status.textContent = '思考中…';
      try {
        const body = { message: msg };
        if (sessionId) body.session_id = sessionId;
        const r = await fetch('/v1/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
          body: JSON.stringify(body),
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || '请求失败');
        sessionId = d.session_id;
        const text = d.kind === 'ask'
          ? [d.question, d.recommendation && '我的建议：' + d.recommendation, d.warn].filter(Boolean).join('\n')
          : (d.message || '（进行中）');
        addBubble('bot', text, d.kind === 'ask' ? d.options : null);
        status.textContent = '会话 ' + sessionId + ' · ' + (d.phase || '');
      } catch (e) {
        addBubble('bot', '出错了：' + e.message);
        status.textContent = '出错，请重试';
      }
    }

    $('#send').onclick = () => send();
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    $('#newSession').onclick = () => { sessionId = null; chat.innerHTML = ''; addBubble('bot', '新会话开始。想写点什么？'); };

    addBubble('bot', '你好，我是 Sculptor。我会先问清楚你要写什么，再帮你列大纲、逐节写作、审"AI 味"。请先在上方保存你的 API Key，然后告诉我你想写的内容。');
  </script>
</body>
</html>
