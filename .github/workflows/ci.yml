name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Agent e2e（离线 mock，74 项断言）
        run: cd agent && npm test
      - name: Shell 语法
        run: |
          bash -n install.sh scripts/install.sh scripts/install-agent.sh \
            skills/sculptor/scripts/install.sh skills/sculptor/hooks/sculptor-hook.sh \
            integration/engine-mcp/apply.sh
      - name: SKILL frontmatter
        run: |
          head -5 skills/sculptor/SKILL.md | grep -q '^name: sculptor' && \
          head -5 skills/sculptor/SKILL.md | grep -q '^description:'
